contact_sensor:
  serial_port: /dev/ttyACM0
  raw_data_divisor: 55.0
  calibration_samples: 100
  thresholds:
    r1: 6.0
    l1: 6.0
    r2: 6.0
    l2: 6.0

realsense_camera:
  stream:
    # Intel RealSense T265 serial. Keep this fixed so the odometry module never
    # probes or opens the D435i while both RealSense cameras are connected.
    serial: "944222110122"

realsense_camera_d435i:
  stream:
    # Leave empty when a single RealSense camera is connected.
    # Set a serial number when several RealSense devices are connected.
    serial: "147122073428"
    width: 424
    height: 240
    # Camera stream FPS must be supported by librealsense for this resolution.
    fps: 30
    # 0 = publish every camera frame. Use 10 to reduce LCM/CPU load while camera runs at 30 FPS.
    publish_fps: 30

  compression:
    enabled: true
    zlib_level: 1

  runtime:
    verbose: false
    # Публикация кадра глубины в LCM-канал depth_image из channels.yaml.
    # Контуру высот она не нужна (кадр идёт внутри процесса), но без неё
    # мост robot_state_viewer не выдаёт /camera/depth_image для rviz.
    publish_depth_image: true

robosense_airy:
  frame_id: rslidar
  # Положение относительно base (= base_link). Начало СК - центр нижней монтажной
  # поверхности (приближение, сверить с документацией Airy), +Z в купол.
  # Временные значения до задания реального кронштейна.
  mount:
    xyz: [0.18, 0.0, 0.16]
    rpy_deg: [0.0, 45.0, 0.0]
  # Airy-96: полусфера 360° x 90°, 10 Гц. Равномерная сетка углов места - приближение.
  scan:
    channels: 96
    horizontal_points: 900   # 0.4° по азимуту
    elevation_range_deg: [0.0, 89.5]
    frame_rate: 10.0         # Гц, 86400 лучей в кадре
  range_min: 0.1
  range_max: 60.0
  range_noise_std: 0.0   # СКО шума дальности, м
  intensity: 100.0
  see_self: False         # True - лидар видит корпус и ноги робота, как на железе
