robot_config:
  # HARDWARE

  # ---------------------------------
  # best params for vision: 
  #   - t_sw = 0.19
  #   - t_st = 0.45
  #   - body_height = 0.2
  #   - stride_height = 0.353-0.362
  #   - dz_near_ground = -0.1
  #   - interleave_y: [0.08, 0.08, 0.08, 0.08]
  #   - ROBOT_BODY_Z = 0.21 
  # ---------------------------------

  # SIMULATION
  g: 9.81

  # leg params
  m1: 0.309
  m2: 0.532
  m3: 0.067

  l1: 0.0595
  l2: 0.13
  l3: 0.1485

  d1: 0.02
  d2: 0.086
  d3: 0.012

  Pc1: [0.05, 0.0, 0.0]
  Pc2: [0.01, 0.0, 0.04]
  Pc3: [0.06, 0.0, 0.01]

  # body params
  bx: 0.106
  by: 0.067

  M: 8.2 
  I_b: [[ 0.012838176, -0.000006851,  0.000156493],
        [-0.000006851,  0.056852389, -0.000095392],
        [ 0.000156493, -0.000095392,  0.064034355]]

  # motor params
  tau_max: [6.0, 6.0, 12.0]
  vel_max: [28.0, 28.0, 14.0]
  gear_ratio: 10.0
  kt: 0.78

  debug_mode: True

emergency:
  max_angles: [1.3, 2.6, 3.1, 
               1.3, 2.6,  3.1,
               1.3, 2.6, 3.1,
               1.3, 2.6,  3.1]

  min_angles: [-1.3, -2.6,  -3.1,
               -1.3, -2.6, -3.1,
               -1.3, -2.6,  -3.1,
               -1.3, -2.6, -3.1]

  # robot_mode_controller lays the robot down and blocks stand up if CONTACT_SENSOR is silent longer (0 - disabled)
  contact_timeout_ms: 50.0
  # fault is cleared only after the data has been arriving without gaps for this time
  contact_recovery_ms: 1000.0

  robot_state_timeout_ms: 50.0

fsm_locomotion:
  command_timeout_s: 0.50
  start_linear_mps: 0.05
  start_yaw_radps: 0.10
  stop_linear_mps: 0.025
  stop_yaw_radps: 0.05
  stop_hold_s: 0.30
  acceleration_limits:
    linear_mps2: 1.0  # ограничение изменения уставки XY при ходьбе, м/с²
    yaw_radps2: 4.0  # ограничение изменения уставки yaw при ходьбе, рад/с²
  # Измеренные скорости и выдержка для подтверждения остановки походки.
  gait_stop:
    linear_mps: 0.05
    yaw_radps: 0.10
    hold_s: 0.30
    linear_decel_mps2: 8.0  # ограничение замедления уставки XY, м/с²
    yaw_decel_radps2: 16.0  # ограничение замедления уставки yaw, рад/с²
  # Нормы ошибок положения и скорости в мировой плоскости XY.
  recovery_entry: {position_m: 0.01, velocity_mps: 0.06} 
  recovery_exit_walking: {position_m: 0.007, velocity_mps: 0.05}
  recovery_exit_standing: {position_m: 0.007, velocity_mps: 0.05}
